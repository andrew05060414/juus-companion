services:
  juus-brain:
    # 当前为部署模板；正式镜像将在 M1 独立服务完成后发布
    image: ghcr.io/andrew05060414/juus-brain:latest
    container_name: juus-brain
    restart: unless-stopped
    ports:
      - "${JUUS_PORT:-8000}:8000"
    environment:
      - JUUS_ENV=${JUUS_ENV:-production}
      - JUUS_PORT=8000
      - MODEL_GATEWAY_BASE_URL=${MODEL_GATEWAY_BASE_URL}
      - MODEL_GATEWAY_API_KEY=${MODEL_GATEWAY_API_KEY}
      - DEFAULT_MODEL=${DEFAULT_MODEL:-deepseek-chat}
      - DATABASE_URL=sqlite:////app/data/juus.db
      - PERSONA_DIR=/app/data/personas
      - NTFY_SERVER_URL=${NTFY_SERVER_URL:-http://juus-ntfy:80}
      - FCM_CREDENTIALS_FILE=${FCM_CREDENTIALS_FILE:-}
    volumes:
      - juus_data:/app/data
      - ../data/personas:/app/data/personas:ro
      - ../data/chronicle:/app/data/chronicle:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - juus-network

  juus-ntfy:
    image: binwiederhier/ntfy:v2.11.0
    container_name: juus-ntfy
    restart: unless-stopped
    command:
      - serve
    environment:
      - NTFY_BEHIND_PROXY=true
      - NTFY_ATTACHMENT_CACHE_DIR=/var/cache/ntfy/attachments
    volumes:
      - ntfy_cache:/var/cache/ntfy
      - ntfy_etc:/etc/ntfy
    ports:
      - "${NTFY_PORT:-8080}:80"
    networks:
      - juus-network

volumes:
  juus_data:
    name: juus_companion_brain_data
  ntfy_cache:
    name: juus_companion_ntfy_cache
  ntfy_etc:
    name: juus_companion_ntfy_etc

networks:
  juus-network:
    name: juus_companion_network
    driver: bridge

